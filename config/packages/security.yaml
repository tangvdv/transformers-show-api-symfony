security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 
            algorithm: 'bcrypt'
            cost: 15
    providers:
        users:
            chain: 
                providers: [user_provider, app_provider]

        user_provider:
            entity:
                class: App\Entity\User
                property: email

        app_provider:
            entity:
                class: App\Entity\Application
                property: client_id
    
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        login:
            pattern: ^/auth/login
            stateless: true
            provider: user_provider
            json_login:
                check_path: /auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        
        token:
            pattern: ^/auth/token
            stateless: true
            provider: app_provider
            json_login:
                check_path: /auth/token
                username_path: client_id
                password_path: client_secret
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        
        api:
            pattern:   ^/api
            stateless: true
            entry_point: jwt
            jwt: ~
            provider: users
        


    access_control:
        - { path: ^/auth/login,         roles: PUBLIC_ACCESS }
        - { path: ^/auth/token,         roles: PUBLIC_ACCESS }
        - { path: ^/auth/signup,        roles: PUBLIC_ACCESS }
        - { path: ^/api,                roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
